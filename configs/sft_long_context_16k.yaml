model:
  vocab_size: 8192
  block_size: 16384
  n_layer: 8
  n_head: 6
  n_kv_head: 2
  n_embd: 384
  mlp_ratio: 2.6666667
  mlp_multiple_of: 128
  dropout: 0.0
  tie_weights: true
  norm_type: rmsnorm
  norm_eps: 1.0e-6
  mlp_type: swiglu
  positional_embedding: rope
  rope_theta: 1000000.0
  qk_norm: true
  linear_bias: false
  initializer_range: 0.02
  residual_scale_init: true
  attention_impl: sdpa
  gradient_checkpointing: true
  moe_num_experts: 4
  moe_top_k: 2
  moe_every_n_layers: 1
  moe_shared_expert: true
  moe_load_balance_loss_coefficient: 1.0e-2
  moe_router_z_loss_coefficient: 1.0e-3
  moe_router_jitter: 0.0

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_jsonl_path: data/public_sft/train.jsonl
  val_jsonl_path: data/public_sft/validation.jsonl

training:
  output_dir: checkpoints/sft_moe_16k
  pretrained_checkpoint: checkpoints/pretrain_moe_16k/best.safetensors
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 5.0e-5
  min_lr: 5.0e-6
  warmup_steps: 200
  max_steps: 12000
  num_workers: 0
  weight_decay: 0.05
  grad_clip: 1.0
  eval_interval: 600
  eval_steps: 100
  save_interval: 1000
  log_interval: 10
  patience: 10
  use_amp: true
  resume_from: ""
  metrics_jsonl_path: checkpoints/sft_moe_16k/metrics.jsonl
  metrics_csv_path: checkpoints/sft_moe_16k/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/sft_moe_16k/sample_generations
  sample_system_prompt: You are a practical long-horizon tool-using assistant.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 256
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
  fused_optimizer: true
  z_loss_coefficient: 1.0e-4
