model:
  vocab_size: 2865
  block_size: 1024
  n_layer: 8
  n_head: 6
  n_embd: 384
  mlp_ratio: 4
  dropout: 0.05
  tie_weights: true
  norm_type: layernorm
  mlp_type: gelu
  positional_embedding: learned
  rope_theta: 10000.0
  attention_impl: auto
  gradient_checkpointing: false

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_jsonl_path: data/sft/sample_train.jsonl
  val_jsonl_path: data/sft/sample_val.jsonl

training:
  output_dir: checkpoints/sft_tiny
  pretrained_checkpoint: checkpoints/pretrain_tiny/best.pt
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  min_lr: 1.0e-5
  warmup_steps: 200
  max_steps: 12000
  num_workers: 0
  weight_decay: 0.05
  grad_clip: 1.0
  eval_interval: 600
  eval_steps: 100
  save_interval: 1000
  log_interval: 10
  patience: 10
  use_amp: true
  resume_from: ""
  metrics_jsonl_path: checkpoints/sft_tiny/metrics.jsonl
  metrics_csv_path: checkpoints/sft_tiny/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/sft_tiny/sample_generations
  sample_system_prompt: You are a practical technical assistant who explains things clearly.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 160
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
