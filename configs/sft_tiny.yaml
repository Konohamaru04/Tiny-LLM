model:
  vocab_size: 4096
  block_size: 16384
  n_layer: 8
  n_head: 6
  n_embd: 384
  mlp_ratio: 4
  dropout: 0.05
  tie_weights: true
  norm_type: rmsnorm
  mlp_type: swiglu
  positional_embedding: rope
  rope_theta: 1000000.0
  attention_impl: sdpa
  gradient_checkpointing: true
  moe_num_experts: 4
  moe_top_k: 2
  moe_every_n_layers: 1
  moe_aux_loss_coef: 0.01
  moe_router_jitter: 0.01

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_jsonl_path: data/sft/unified_train.jsonl
  val_jsonl_path: data/sft/unified_val.jsonl

training:
  output_dir: checkpoints/unified_moe_sft
  pretrained_checkpoint: checkpoints/unified_moe_16k/best.pt
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 8.0e-5
  min_lr: 8.0e-6
  warmup_steps: 300
  max_steps: 16000
  num_workers: 0
  weight_decay: 0.05
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 50
  save_interval: 500
  log_interval: 10
  patience: 20
  use_amp: true
  resume_from: ""
  metrics_jsonl_path: checkpoints/unified_moe_sft/metrics.jsonl
  metrics_csv_path: checkpoints/unified_moe_sft/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/unified_moe_sft/sample_generations
  sample_system_prompt: You are a practical assistant that can reason, plan, and use tools.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 384
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
