model:
  vocab_size: 8192
  block_size: 4096
  n_layer: 8
  n_head: 6
  n_kv_head: 2
  n_embd: 384
  mlp_ratio: 2.6666667
  mlp_multiple_of: 128
  dropout: 0.0
  tie_weights: true
  norm_type: rmsnorm
  norm_eps: 1.0e-6
  mlp_type: swiglu
  positional_embedding: rope
  rope_theta: 1000000.0
  qk_norm: true
  linear_bias: false
  initializer_range: 0.02
  residual_scale_init: true
  attention_impl: sdpa
  gradient_checkpointing: true
  moe_num_experts: 4
  moe_top_k: 2
  moe_every_n_layers: 1
  moe_shared_expert: true
  moe_load_balance_loss_coefficient: 1.0e-2
  moe_router_z_loss_coefficient: 1.0e-3
  moe_router_jitter: 0.01

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_manifest_path: data/processed/train_manifest.json
  val_manifest_path: data/processed/val_manifest.json
  train_array_path: data/processed/lm_train_4k.npy
  val_array_path: data/processed/lm_val_4k.npy
  meta_path: data/processed/lm_meta_4k.json

training:
  output_dir: checkpoints/pretrain_moe_4k
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-5
  min_lr: 3.0e-6
  warmup_steps: 100
  max_steps: 1000
  num_workers: 0
  weight_decay: 0.10
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 20
  save_interval: 100
  log_interval: 5
  patience: 10
  use_amp: true
  resume_from: checkpoints/pretrain_moe/latest.safetensors
  metrics_jsonl_path: checkpoints/pretrain_moe_4k/metrics.jsonl
  metrics_csv_path: checkpoints/pretrain_moe_4k/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/pretrain_moe_4k/sample_generations
  sample_system_prompt: You are a practical long-context assistant.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 256
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
  fused_optimizer: true
  z_loss_coefficient: 1.0e-4
