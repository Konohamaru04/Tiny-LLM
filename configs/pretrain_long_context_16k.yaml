model:
  vocab_size: 4096
  block_size: 16384
  n_layer: 8
  n_head: 6
  n_embd: 384
  mlp_ratio: 4
  dropout: 0.05
  tie_weights: true
  norm_type: rmsnorm
  mlp_type: swiglu
  positional_embedding: rope
  rope_theta: 1000000.0
  attention_impl: sdpa
  gradient_checkpointing: true

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_manifest_path: data/processed/train_manifest.json
  val_manifest_path: data/processed/val_manifest.json
  train_array_path: data/processed/lm_train_16k.npy
  val_array_path: data/processed/lm_val_16k.npy
  meta_path: data/processed/lm_meta_16k.json

training:
  output_dir: checkpoints/unified_moe_16k
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 128
  learning_rate: 3.0e-5
  min_lr: 3.0e-6
  warmup_steps: 100
  max_steps: 2000
  num_workers: 0
  weight_decay: 0.10
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 10
  save_interval: 100
  log_interval: 5
  patience: 20
  use_amp: true
  # Continue from the 4K unified base checkpoint. The training script restores
  # optimizer state when compatible; use a model-only warm start if repacking
  # or optimizer shapes differ in a future implementation.
  resume_from: checkpoints/unified_moe/latest.pt
  metrics_jsonl_path: checkpoints/unified_moe_16k/metrics.jsonl
  metrics_csv_path: checkpoints/unified_moe_16k/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/unified_moe_16k/sample_generations
  sample_system_prompt: You are a long-context assistant that can reason, plan, and use tools.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 512
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
