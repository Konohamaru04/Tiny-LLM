model:
  vocab_size: 4096
  block_size: 4096
  n_layer: 8
  n_head: 6
  n_embd: 384
  mlp_ratio: 4
  dropout: 0.05
  tie_weights: true
  norm_type: rmsnorm
  mlp_type: swiglu
  positional_embedding: rope
  rope_theta: 1000000.0
  attention_impl: sdpa
  gradient_checkpointing: true
  moe_num_experts: 4
  moe_top_k: 2
  moe_every_n_layers: 1
  moe_aux_loss_coef: 0.01
  moe_router_jitter: 0.01

data:
  tokenizer_model_path: data/processed/tokenizer.model
  train_manifest_path: data/processed/train_manifest.json
  val_manifest_path: data/processed/val_manifest.json
  train_array_path: data/processed/lm_train.npy
  val_array_path: data/processed/lm_val.npy
  meta_path: data/processed/lm_meta.json

training:
  output_dir: checkpoints/unified_moe
  seed: 0
  batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 250
  max_steps: 10000
  num_workers: 0
  weight_decay: 0.10
  grad_clip: 1.0
  eval_interval: 250
  eval_steps: 25
  save_interval: 250
  log_interval: 10
  patience: 20
  use_amp: true
  resume_from: ""
  metrics_jsonl_path: checkpoints/unified_moe/metrics.jsonl
  metrics_csv_path: checkpoints/unified_moe/metrics.csv
  sample_prompts_path: configs/eval_prompts.jsonl
  sample_output_dir: checkpoints/unified_moe/sample_generations
  sample_system_prompt: You are a practical technical assistant who can reason and use tools.
  sample_max_history_turns: 0
  sample_temperature: 0.4
  sample_top_k: 80
  sample_max_new_tokens: 256
  sample_repetition_penalty: 1.05
  sample_json_mode: false
  compile_model: false
  compile_backend: ""
  compile_mode: ""
