[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm"
version = "0.2.0"
description = "A unified sparse-MoE language model with reasoning, tool use, and long-context training."
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Konohamaru04" },
]
dependencies = [
  "torch>=2.2.0,<2.6.0",
  "sentencepiece>=0.1.99,<0.3.0",
  "numpy>=1.26.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "tqdm>=4.66.0,<5.0.0",
  "aiofiles>=23.0.0,<25.0.0",
  "datasets>=3.2.0,<5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
